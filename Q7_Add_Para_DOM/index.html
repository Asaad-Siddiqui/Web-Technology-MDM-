<!DOCTYPE html>
<html>
<head>
    <title>Add Paragraph</title>
</head>
<body>

<button onclick="addPara()">Add Paragraph</button>
<div id="container"></div>

<script>
function addPara() {
    let p = document.createElement("p");
    p.textContent = "New paragraph added!";
    document.getElementById("container").appendChild(p);
}
</script>

</body>
</html>
