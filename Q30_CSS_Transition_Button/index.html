<!DOCTYPE html>
<html>

<head>
    <title>CSS Transition Button</title>
    <style>
        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            transition: background-color 0.5s;
        }

        button:hover {
            background-color: green;
        }
    </style>
</head>

<body><button>Hover Me</button></body>

</html>
