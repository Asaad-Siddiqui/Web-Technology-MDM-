<!DOCTYPE html>
<html>
<head>
    <title>HTML5 Video Player</title>
</head>
<body>

<h2>HTML5 Video Player</h2>

<h3>Simple Video Player</h3>
<video width="400" controls>
    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>

<h3>Video with Poster Image</h3>
<video width="400" controls poster="https://via.placeholder.com/400x300">
    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>

<h3>Multiple Video Formats</h3>
<video width="400" controls>
    <source src="movie.mp4" type="video/mp4">
    <source src="movie.ogg" type="video/ogg">
    Your browser does not support the video tag.
</video>

<h3>Video with Autoplay and Loop</h3>
<video width="400" autoplay loop muted>
    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>

</body>
</html>
