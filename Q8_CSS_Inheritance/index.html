<!DOCTYPE html>
<html>
<head>
    <title>Inheritance</title>
    <style>
        div {
            color: blue;   /* inherited */
        }

        p {
            color: red;    /* overrides */
        }
    </style>
</head>
<body>

<div>
    Parent Text
    <p>Child Paragraph (overrides parent)</p>
    <span>Child Span (inherits blue)</span>
</div>

</body>
</html>
