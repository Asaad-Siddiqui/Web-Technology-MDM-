<!DOCTYPE html>
<html>
<head>
    <title>AJAX Content Change</title>
</head>
<body>

<h2>Content Updates with AJAX</h2>
<button onclick="loadContent()">Load New Content</button>
<div id="content"></div>

<script>
function loadContent() {
    let xhr = new XMLHttpRequest();
    xhr.open("GET", "https://jsonplaceholder.typicode.com/posts/2", true);
    
    xhr.onload = function() {
        if (xhr.status == 200) {
            let data = JSON.parse(xhr.responseText);
            document.getElementById("content").innerHTML = "<h3>" + data.title + "</h3><p>" + data.body + "</p>";
        }
    };
    
    xhr.send();
}
</script>

</body>
</html>
