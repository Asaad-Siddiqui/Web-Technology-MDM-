<!DOCTYPE html>
<html>
<head>
    <title>Different Types of Lists</title>
</head>
<body>

<h2>Types of Lists</h2>

<h3>Ordered List</h3>
<ol>
    <li>First Item</li>
    <li>Second Item</li>
    <li>Third Item</li>
</ol>

<h3>Unordered List</h3>
<ul>
    <li>Item One</li>
    <li>Item Two</li>
    <li>Item Three</li>
</ul>

<h3>Nested List</h3>
<ul>
    <li>Main Item 1
        <ul>
            <li>Sub Item 1.1</li>
            <li>Sub Item 1.2</li>
        </ul>
    </li>
    <li>Main Item 2
        <ul>
            <li>Sub Item 2.1</li>
            <li>Sub Item 2.2</li>
            <li>Sub Item 2.3</li>
        </ul>
    </li>
    <li>Main Item 3</li>
</ul>

</body>
</html>
