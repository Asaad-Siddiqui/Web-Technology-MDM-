<!DOCTYPE html>
<html>
<head>
    <title>DOM Example</title>
</head>
<body>

<p id="para">This is original text.</p>

<button onclick="changeText()">Click Me</button>

<script>
function changeText() {
    let p = document.getElementById("para");
    p.innerHTML = "Text has been changed!";
    p.style.color = "red";
    p.style.fontSize = "20px";
}
</script>

</body>
</html>
