<!DOCTYPE html>
<html>
<head>
    <title>Factorial</title>
</head>
<body>

<script>
function factorial(n) {
    let result = 1;
    for (let i = 1; i <= n; i++) {
        result *= i;
    }
    return result;
}

let num = 5;
console.log("Factorial of " + num + " is " + factorial(num));
</script>

</body>
</html>
