<!DOCTYPE html>
<html>
<head>
    <title>DOM Operations</title>
</head>
<body>

<h2>JavaScript DOM Operations</h2>

<p id="para1">Original paragraph text.</p>

<button onclick="changeText()">Change Text</button>
<button onclick="addElement()">Add Element</button>
<button onclick="removeElement()">Remove Element</button>
<button onclick="changeStyle()">Change Style</button>

<div id="container"></div>

<script>
function changeText() {
    document.getElementById("para1").textContent = "Text has been changed!";
}

function addElement() {
    let newDiv = document.createElement("div");
    newDiv.textContent = "New element added!";
    document.getElementById("container").appendChild(newDiv);
}

function removeElement() {
    let container = document.getElementById("container");
    if (container.lastChild) {
        container.removeChild(container.lastChild);
    }
}

function changeStyle() {
    document.getElementById("para1").style.color = "red";
    document.getElementById("para1").style.fontSize = "18px";
    document.getElementById("para1").style.backgroundColor = "yellow";
}
</script>

</body>
</html>
