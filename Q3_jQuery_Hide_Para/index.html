<!DOCTYPE html>
<html>
<head>
    <title>jQuery Hide</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<p>This is a paragraph.</p>
<button id="btn">Hide</button>

<script>
$(document).ready(function(){
    $("#btn").click(function(){
        $("p").hide();
    });
});
</script>

</body>
</html>
